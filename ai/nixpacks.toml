# Railway uses Nixpacks. This file tells it to install the Tesseract OCR
# system binary alongside the Python dependencies, so api/ai_verify_document.php
# gets real OCR results in production instead of "ocr_engine: none".
[phases.setup]
nixPkgs = ["tesseract", "python312", "gcc"]

[phases.install]
cmds = ["pip install --upgrade pip && pip install -r requirements.txt"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app"
